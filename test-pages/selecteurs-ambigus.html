<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Sélecteurs ambigus</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      table { border-collapse: collapse; margin-bottom: 1.5rem; }
      th, td { border: 1px solid #999; padding: 0.3rem 0.6rem; }
    </style>
  </head>
  <body>
    <h1>Pièges de localisation</h1>

    <!-- Deux tableaux identiques, sans identifiant ni classe distinctive. -->
    <div class="bloc">
      <table class="grille">
        <thead><tr><th>Code</th><th>Date</th><th>Date</th></tr></thead>
        <tbody>
          <tr><td>A1</td><td>01/01/2024</td><td>31/12/2024</td></tr>
          <tr><td>A2</td><td>01/02/2024</td><td>30/06/2024</td></tr>
        </tbody>
      </table>
    </div>
    <div class="bloc">
      <table class="grille">
        <thead><tr><th>Code</th><th>Date</th><th>Date</th></tr></thead>
        <tbody>
          <tr><td>B1</td><td>01/03/2024</td><td>31/03/2024</td></tr>
          <tr><td>B2</td><td>01/04/2024</td><td>30/04/2024</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Le même libellé et le même identifiant apparaissent deux fois. -->
    <section>
      <h2>Responsable</h2>
      <p><span class="lib">Nom :</span> <span id="nom">Cherif Malik</span></p>
    </section>
    <section>
      <h2>Suppléant</h2>
      <p><span class="lib">Nom :</span> <span id="nom">Moreau Julie</span></p>
    </section>
  </body>
</html>
